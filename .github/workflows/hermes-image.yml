name: Hermes image

on:
  pull_request:
    paths:
      - images/hermes/**
      - runtime/**
      - test/runtime/**
      - internal/config/**
      - .github/workflows/hermes-image.yml
  push:
    branches: [main]
    paths:
      - images/hermes/**
      - runtime/**
      - test/runtime/**
      - internal/config/**
      - .github/workflows/hermes-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested v2026.9.14 image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: images/hermes
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: wbe7/hermes:v2026.9.14-${{ matrix.architecture }}
          cache-from: type=gha,scope=hermes-${{ matrix.architecture }}
          # Cache outages must not skip acceptance of an already built image.
          cache-to: type=gha,scope=hermes-${{ matrix.architecture }},mode=max,ignore-error=true
      - name: Browser, office, PDF, OCR and chart acceptance
        env:
          HERMES_TOOLS_IMAGE: wbe7/hermes:v2026.9.14-${{ matrix.architecture }}
        run: make test-hermes-image
      - name: Original Hermes runtime compatibility
        env:
          HERMES_RUNTIME_IMAGE: wbe7/hermes:v2026.9.14-${{ matrix.architecture }}
        run: make test-runtime
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: go.sum
      - name: Rendered operator configuration with the derived image
        env:
          HERMES_RUNTIME_TEST: "1"
          HERMES_RUNTIME_IMAGE: wbe7/hermes:v2026.9.14-${{ matrix.architecture }}
        run: go test -count=1 -run TestOfficialRuntime -v ./internal/config
      - name: Log in for explicit publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push exactly the tested image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          IMAGE: wbe7/hermes:v2026.9.14-${{ matrix.architecture }}
        run: |
          docker push "$IMAGE"
          mkdir -p digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > digests/${{ matrix.architecture }}.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          name: hermes-digest-${{ matrix.architecture }}
          path: digests/*.txt

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: hermes-digest-*
          merge-multiple: true
          path: digests
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-architecture image
        run: |
          mapfile -t images < <(cat digests/amd64.txt digests/arm64.txt)
          test "${#images[@]}" -eq 2
          for image in "${images[@]}"; do
            [[ "$image" =~ ^(docker.io/)?wbe7/hermes@sha256:[a-f0-9]{64}$ ]]
          done
          docker buildx imagetools create -t wbe7/hermes:v2026.9.14 "${images[@]}"
          docker buildx imagetools inspect wbe7/hermes:v2026.9.14 >> "$GITHUB_STEP_SUMMARY"
          echo 'Register this tested digest in internal/runtimecatalog/catalog.go before deploying.' >> "$GITHUB_STEP_SUMMARY"
