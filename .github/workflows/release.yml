name: Release

on:
  push:
    tags:
      - operator-v*.*.*

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wbe7/hermes-operator

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Derive and validate version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#operator-v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make test-unit lint-chart verify-docs verify-generated
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build scanable image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: hermes-operator:scan
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed hermes-operator:scan
      - name: Publish multi-architecture image and SBOM attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Package chart and release files
        shell: bash
        run: |
          mkdir -p dist
          helm package charts/hermes-operator --version '${{ steps.version.outputs.version }}' --app-version '${{ steps.version.outputs.version }}' --destination dist
          cp config/crd/bases/hermes.wbe7.github.io_hermes.yaml dist/hermes.crd.yaml
          cp docs/reference/compatibility.md dist/compatibility.md
          (cd dist && sha256sum hermes-operator-*.tgz hermes.crd.yaml compatibility.md > SHA256SUMS)
      - name: Publish chart
        shell: bash
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin
          helm push dist/hermes-operator-*.tgz oci://ghcr.io/wbe7/charts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hermes-operator-*.tgz
            dist/hermes.crd.yaml
            dist/compatibility.md
            dist/SHA256SUMS
