# Targets are restricted Python Pods generated by prepare-network.py.
# A Service translating to an explicitly allowed backend can also be reachable.
apiVersion: v1
kind: Service
metadata:
  name: network-target
  namespace: hermes-operator-test
spec:
  ipFamilyPolicy: RequireDualStack
  selector:
    app: network-target
  ports:
    - port: 8080
      targetPort: 8080
