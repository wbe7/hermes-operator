# Проект API; применять после реализации и установки CRD.
# Secret maria-hermes-secret должен содержать TELEGRAM_BOT_TOKEN и MODEL_API_KEY.
apiVersion: hermes.wbe7.github.io/v1alpha1
kind: Hermes
metadata:
  name: maria
  namespace: hermes-users
spec:
  version: v2026.9.14
  model:
    provider: custom
    name: tenant-model
    baseURL: https://inference.example.com/v1
    apiMode: chat_completions
  telegram:
    allowedUserIDs: ["123456789"]
  storage:
    create:
      size: 10Gi
