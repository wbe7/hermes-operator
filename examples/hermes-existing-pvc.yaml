# PVC maria-home and Secret maria-hermes-secret must already exist in this namespace.
# Existing PVCs are never deleted or resized by the operator.
apiVersion: hermes.wbe7.github.io/v1alpha1
kind: Hermes
metadata:
  name: maria
  namespace: hermes-users
spec:
  version: v2026.9.14
  model:
    provider: custom
    name: tenant-model
    baseURL: https://inference.example.com/v1
    apiMode: chat_completions
  telegram:
    allowedUserIDs: ["123456789"]
  storage:
    existingClaim: maria-home
    deletionPolicy: Retain
