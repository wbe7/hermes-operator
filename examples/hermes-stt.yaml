apiVersion: hermes.wbe7.github.io/v1alpha1
kind: Hermes
metadata:
  name: maria
  namespace: hermes-users
spec:
  version: v2026.9.14
  model:
    provider: custom
    name: tenant-model
    baseURL: https://inference.example.com/v1
  stt:
    enabled: true
    model: qwen3-asr-1.7b
    # URL and key inherit model settings. Defaults: language ru, echoTranscripts true.
  telegram:
    allowedUserIDs: ["123456789"]
  storage:
    create:
      size: 10Gi
