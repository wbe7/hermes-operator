apiVersion: v1
kind: Namespace
metadata:
  name: hermes-users
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-installation-admin
  namespace: hermes-users
rules:
  - apiGroups: [hermes.wbe7.github.io]
    resources: [hermes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [hermes.wbe7.github.io]
    resources: [hermes/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-installation-admin
  namespace: hermes-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-installation-admin
subjects:
  - kind: Group
    name: REPLACE_WITH_NAMESPACE_ADMIN_GROUP
    apiGroup: rbac.authorization.k8s.io
